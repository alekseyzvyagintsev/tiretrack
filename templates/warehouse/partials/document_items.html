{% for item in items %}
<tr>
    <td>{{ item.product_name }}</td>
    <td>
        {% if document.status == 'draft' %}
        <input type="number" 
               class="form-control form-control-sm quantity-input" 
               value="{{ item.quantity }}"
               min="1"
               name="item_{{ item.pk }}"
               hx-post="{% url 'warehouse:document-save-quantities' pk=document.pk %}"
               hx-trigger="change delay:300ms"
               hx-include="closest tr">
        {% else %}
        {{ item.quantity }}
        {% endif %}
    </td>
    <td class="text-end">
        {% if document.status == 'draft' or document.status == 'saved' %}
        <button type="button" class="btn btn-sm btn-outline-danger" 
                hx-post="{% url 'warehouse:document-delete-item' pk=document.pk item_pk=item.pk %}"
                hx-confirm="Удалить эту позицию?"
                hx-target="#documentItemsTable tbody">
            <i class="fas fa-trash"></i>
        </button>
        {% endif %}
    </td>
</tr>
{% endfor %}
