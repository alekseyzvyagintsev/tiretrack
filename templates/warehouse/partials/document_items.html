{% for item in items %}
<tr>
    <td>{{ item.product_name }}</td>
    <td>
        {% if document.status == 'draft' %}
        <input type="number" 
               class="form-control form-control-sm quantity-input" 
               value="{{ item.quantity }}"
               min="1"
               name="item_{{ item.pk }}"
               hx-post="{% url 'warehouse:document-save-quantities' pk=document.pk %}"
               hx-trigger="change delay:300ms"
               hx-include="closest tr">
        {% else %}
        {{ item.quantity }}
        {% endif %}
    </td>
    <td class="text-end">
        {% if document.status == 'draft' or document.status == 'saved' %}
        <button type="button" class="btn btn-sm btn-outline-danger delete-document-item-btn"
                data-document-id="{{ document.id }}"
                data-item-id="{{ item.pk }}"
                data-product-name="{{ item.product_name }}"
                data-csrf-token="{{ csrf_token }}">
            <i class="fas fa-trash"></i>
        </button>
        {% endif %}
    </td>
</tr>
{% endfor %}
