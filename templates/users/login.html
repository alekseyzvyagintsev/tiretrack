<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - TireTrack</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link href="{{ STATIC_URL }}css/style.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .login-card {
            border-radius: 24px;
            box-shadow: 12px 12px 24px rgba(0, 0, 0, 0.2), 
                        -12px -12px 24px rgba(255, 255, 255, 0.2);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-header h1 {
            font-weight: 800;
            color: white;
            margin-bottom: 16px;
        }
        
        .login-header p {
            color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="login-card p-5">
                    <div class="login-header">
                        <i class="fas fa-truck-monster fa-3x text-white mb-3"></i>
                        <h1>TireTrack</h1>
                        <p>Система управления QR-кодами шин</p>
                    </div>
                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                    
                    <form method="post" action="{% url 'users:login' %}">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Email</label>
                            <div class="neomorph-card p-3">
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-envelope text-primary"></i>
                                    </span>
                                    <input type="email" 
                                           name="email" 
                                           class="form-control border-0 bg-transparent" 
                                           placeholder="Введите ваш email"
                                           required
                                           autofocus>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Пароль</label>
                            <div class="neomorph-card p-3">
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-lock text-primary"></i>
                                    </span>
                                    <input type="password" 
                                           name="password" 
                                           class="form-control border-0 bg-transparent" 
                                           placeholder="Введите пароль"
                                           required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-3">
                            <button type="submit" class="neomorph-btn btn-lg btn-primary">
                                <i class="fas fa-sign-in-alt"></i> Войти
                            </button>
                            
                            <a href="{% url 'tires:warehouse-list' %}" class="neomorph-btn">
                                <i class="fas fa-arrow-left"></i> Назад к складам
                            </a>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">
                            Нет аккаунта? 
                            <a href="#" class="text-primary fw-bold">Зарегистрироваться</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
